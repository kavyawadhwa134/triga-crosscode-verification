name: check-claims

# Recompute the README's headline numbers from the committed CSVs and check
# documentation links. Standard-library Python only: no OpenMC, Cardinal or
# nuclear data is needed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Headline numbers match committed results
        run: python3 scripts/check_claims.py
      - name: Documentation links resolve to tracked files
        if: ${{ !cancelled() }}
        run: python3 scripts/check_links.py
